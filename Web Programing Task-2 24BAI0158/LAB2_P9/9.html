<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Priority Demonstration</title>

    <!-- Internal CSS -->
    <style>
        p {
            color: blue;
            font-size: 16px;
            background-color: lightyellow;
            padding: 10px;
        }
    </style>
</head>
<body>

    <!-- Inline CSS overrides internal CSS -->
    <p style="color: red; font-size: 20px;">
        Inline CSS takes precedence over internal CSS in case of conflicts.
    </p>
        <p>VIHAAN VARSHNEY 24BAI0158</p>


</body>
</html>
