<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Awareness Page</title>
    <style>
        /* Styling the block element */
        .product-info {
            background-color: #f2f2f2;
            padding: 20px;
            width: 350px;
            font-family: Arial, sans-serif;
            border-radius: 8px;
        }

        /* Styling the inline element */
        .price {
            color: green;
            font-weight: bold;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="product-info">
        <p>Agricultural Equipment Price: 
            <span class="price">₹50,000</span>
        </p>
    </div>

</body>
</html>
