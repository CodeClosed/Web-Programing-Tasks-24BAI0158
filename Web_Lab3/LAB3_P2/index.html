<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Color</title>

    <script>
        // Function that changes the background color
        // The color value is received as a parameter
        function changeColor(color){

            // Changes the background color of the entire webpage
            document.body.style.backgroundColor = color;
        }
    </script>

</head>
<body>

    <!-- Heading for the webpage -->
    <h1>Change Background-Color</h1>

    <!-- Button to change background color to red -->
    <input type="button" value="Red" onclick="changeColor('red');">

    <!-- Button to change background color to blue -->
    <input type="button" value="Blue" onclick="changeColor('blue');">
    
    <!-- Button to change background color to green -->
    <input type="button" value="Green" onclick="changeColor('green');">

</body>
</html>
