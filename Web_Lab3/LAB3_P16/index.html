<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Overlapping Image Gallery</title>

    <style>
        /* Page styling */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Gallery container */
        .gallery {
            position: relative;
            /* Parent reference for absolute elements */
            width: 600px;
            height: 400px;
            margin: 40px auto;
            border: 2px solid #333;
        }

        /* Image styling */
        .gallery img {
            position: absolute;
            /* Allows images to overlap */
            width: 200px;
            height: 150px;
            cursor: pointer;

            /* Smooth scaling animation */
            transition: transform 0.3s;
        }

        /* Slight zoom effect on hover */
        .gallery img:hover {
            transform: scale(1.05);
        }

        /* Initial overlapping positions with different z-index values */
        #img1 {
            top: 20px;
            left: 30px;
            z-index: 1;
        }

        #img2 {
            top: 80px;
            left: 120px;
            z-index: 2;
        }

        #img3 {
            top: 140px;
            left: 210px;
            z-index: 3;
        }

        #img4 {
            top: 200px;
            left: 300px;
            z-index: 4;
        }
    </style>

    <script>

        // Global variable to track the highest z-index value
        let topIndex = 4;

        // Function to bring the clicked image to the front
        function bringToFront(element) {

            // Increase the topIndex using prefix increment operator
            // Assign the new z-index to the clicked image
            element.style.zIndex = ++topIndex;
        }

    </script>

</head>

<body>

    <h2>Overlapping Image Gallery</h2>
    <p>Click any image to bring it to the front</p>

    <div class="gallery">

        <!-- Each image calls the function when clicked -->
        <img id="img1" src="https://picsum.photos/id/1015/200/150" onclick="bringToFront(this)">

        <img id="img2" src="https://picsum.photos/id/1025/200/150" onclick="bringToFront(this)">

        <img id="img3" src="https://picsum.photos/id/1035/200/150" onclick="bringToFront(this)">

        <img id="img4" src="https://picsum.photos/id/1045/200/150" onclick="bringToFront(this)">

    </div>

    <p>VIHAAN VARSHNEY 24BAI0158</p>
</body>

</html>
